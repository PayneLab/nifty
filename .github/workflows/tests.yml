name: Run Tests

on:
  push:
    branches: [ optimization-memory ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cloudpickle numpy pandas scikit-learn statsmodels

      - name: Run Unit Tests
        run: |
          python UnitTests/DataSplitterTests.py
          python UnitTests/DataStructureCheckerTests.py
          python UnitTests/DataTransformerTests.py
          python UnitTests/EvaluateRulesTests.py
          python UnitTests/ExperimentalClassifierTests.py
          python UnitTests/FeatureSelectorTests.py
          python UnitTests/GenerateRulesTests.py
          python UnitTests/ModelGeneratorTests.py
          python UnitTests/ParameterCheckerTests.py

      - name: Run Regression Tests
        run: |
          python RegressionTests/runallregressiontests.py